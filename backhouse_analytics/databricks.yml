# This is a Databricks asset bundle definition for backhouse_analytics.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: backhouse_analytics
  uuid: 9530583f-aaf7-4925-95d7-c0681b12e811

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to uses
  schema:
    description: The schema to uses

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    #mode: development
    presets:
      name_prefix: dev_
    default: true
    workspace:
      host: https://dbc-0c89d4ad-b77c.cloud.databricks.com
    variables:
      catalog: bakhouse_dev
      schema: rnd
  prod:
    mode: production
    presets:
      name_prefix: prod_
    workspace:
      host: https://dbc-0c89d4ad-b77c.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/nmv.apps@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/nmv.apps@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: bakhouse_prod
      schema: rnd
    permissions:
      - user_name: nmv.apps@gmail.com
        level: CAN_MANAGE
